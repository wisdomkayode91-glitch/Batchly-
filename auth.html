<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Batchly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{
    --bg:#FBFAF6; --surface:#F3F1EA; --surface-2:#E8E4D8; --border:#DCD7C8;
    --text:#16211B; --text-dim:#5B685F;
    --brand:#1F5D4C; --brand-dark:#163F34; --brand-tint:#E4EEE9;
    --accent:#C17817; --accent-hover:#D99A3D; --accent-tint:#F6E9D3;
    --positive:#2F9E5B; --caution:#E0932B; --critical:#C94A3B;
    --shadow: 0 1px 2px rgba(22,33,27,0.04), 0 8px 24px rgba(22,33,27,0.06);
    color-scheme: light;
  }
  html[data-theme="dark"]{
    --bg:#0E1512; --surface:#151F1A; --surface-2:#1D2A23; --border:#2A362F;
    --text:#F2F1E9; --text-dim:#9BAAA0;
    --brand:#3FA184; --brand-dark:#2B7A62; --brand-tint:#16241E;
    --accent:#E0A94D; --accent-hover:#EFC077; --accent-tint:#2A2013;
    --positive:#46C27C; --caution:#F0A94E; --critical:#E2695A;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
    transition:background .25s ease, color .25s ease;
  }
  header{display:flex; align-items:center; justify-content:space-between; padding:20px 24px;}
  .brand{display:flex; align-items:center; gap:10px; font-family:'Fraunces',serif; font-weight:700; font-size:1.15rem; text-decoration:none; color:var(--text);}
  .brand-mark{width:26px; height:26px;}
  .theme-toggle{
    width:38px; height:38px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface); cursor:pointer; color:var(--text);
    display:flex; align-items:center; justify-content:center;
  }
  .theme-toggle svg{width:18px; height:18px;}

  main{flex:1; display:flex; align-items:center; justify-content:center; padding:24px;}
  .card{
    width:100%; max-width:400px; background:var(--surface); border:1px solid var(--border);
    border-radius:18px; padding:32px 28px; box-shadow:var(--shadow);
  }
  .tabs{display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:10px; margin-bottom:26px;}
  .tab{
    flex:1; text-align:center; padding:9px 0; border-radius:8px; font-weight:600; font-size:0.9rem;
    cursor:pointer; color:var(--text-dim); border:none; background:transparent; font-family:inherit;
  }
  .tab.active{background:var(--bg); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,0.06);}

  h1{font-family:'Fraunces',serif; font-size:1.5rem; font-weight:600; margin-bottom:6px;}
  .subtitle{color:var(--text-dim); font-size:0.92rem; margin-bottom:24px;}

  label{display:block; font-size:0.85rem; font-weight:600; margin-bottom:6px; margin-top:16px;}
  label:first-of-type{margin-top:0;}
  input{
    width:100%; padding:11px 13px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; font-size:0.95rem;
  }
  input:focus{outline:2px solid var(--brand); outline-offset:1px;}

  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:42px;}
  .pw-eye{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    width:30px; height:30px; border:none; background:transparent; cursor:pointer;
    color:var(--text-dim); display:flex; align-items:center; justify-content:center;
  }
  .pw-eye svg{width:18px; height:18px;}
  .pw-hint{font-size:0.78rem; color:var(--text-dim); margin-top:5px;}
  .pw-hint.ok{color:var(--positive);}
  .pw-hint.bad{color:var(--critical);}

  .btn{
    width:100%; margin-top:24px; padding:12px 0; border-radius:10px; border:none;
    background:var(--brand); color:#fff; font-weight:600; font-size:0.96rem; cursor:pointer;
  }
  .btn:hover{background:var(--brand-dark);}
  .btn:disabled{opacity:0.6; cursor:not-allowed;}

  .msg{margin-top:16px; padding:11px 13px; border-radius:10px; font-size:0.86rem; display:none;}
  .msg.error{display:block; background:color-mix(in srgb, var(--critical) 14%, transparent); color:var(--critical);}
  .msg.success{display:block; background:color-mix(in srgb, var(--positive) 14%, transparent); color:var(--positive);}

  .panel{display:none;}
  .panel.active{display:block;}
</style>
</head>
<body>

<header>
  <a href="index.html" class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" fill="none">
      <rect x="4" y="4" width="24" height="24" rx="7" fill="var(--brand)"/>
      <path d="M12 20V12H15.5C17.433 12 19 13.567 19 15.5C19 17.433 17.433 19 15.5 19H13.2" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M13.2 19L19 23" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Batchly
  </a>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
    <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
  </button>
</header>

<main>
  <div class="card">
    <div class="tabs">
      <button class="tab active" id="tabLogin">Log in</button>
      <button class="tab" id="tabSignup">Create account</button>
    </div>

    <!-- LOG IN -->
    <div class="panel active" id="panelLogin">
      <h1>Welcome back</h1>
      <p class="subtitle">Log in to your pharmacy's account.</p>
      <form id="formLogin">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required autocomplete="email">
        <label for="loginPassword">Password</label>
        <div class="pw-wrap">
          <input type="password" id="loginPassword" required autocomplete="current-password">
          <button type="button" class="pw-eye" data-toggle="loginPassword" aria-label="Show password">👁️</button>
        </div>
        <button class="btn" type="submit" id="loginBtn">Log in</button>
      </form>
      <div class="msg" id="loginMsg"></div>
    </div>

    <!-- SIGN UP -->
    <div class="panel" id="panelSignup">
      <h1>Set up your pharmacy</h1>
      <p class="subtitle">Creates your account and your pharmacy's private workspace.</p>
      <form id="formSignup">
        <label for="pharmacyName">Pharmacy name</label>
        <input type="text" id="pharmacyName" required placeholder="e.g. Grace Pharmacy, Ikeja">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" required autocomplete="email">
        <label for="signupPassword">Password</label>
        <div class="pw-wrap">
          <input type="password" id="signupPassword" required minlength="8" autocomplete="new-password">
          <button type="button" class="pw-eye" data-toggle="signupPassword" aria-label="Show password">👁️</button>
        </div>
        <div class="pw-hint" id="pwHint">At least 8 characters, with one capital letter, one lowercase letter, one number, and one special character ($ # & etc).</div>

        <label for="signupPasswordConfirm">Confirm password</label>
        <div class="pw-wrap">
          <input type="password" id="signupPasswordConfirm" required minlength="8" autocomplete="new-password">
          <button type="button" class="pw-eye" data-toggle="signupPasswordConfirm" aria-label="Show password">👁️</button>
        </div>
        <div class="pw-hint" id="pwMatchHint"></div>

        <button class="btn" type="submit" id="signupBtn">Create account</button>
      </form>
      <div class="msg" id="signupMsg"></div>
    </div>
  </div>
</main>

<script>
  // ---------- Theme ----------
  const root = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  const iconSun = document.getElementById('iconSun');
  const iconMoon = document.getElementById('iconMoon');
  function applyTheme(theme){
    root.setAttribute('data-theme', theme);
    iconSun.style.display = theme === 'dark' ? 'none' : 'block';
    iconMoon.style.display = theme === 'dark' ? 'block' : 'none';
  }
  applyTheme(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  themeToggle.addEventListener('click', () => {
    applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  // ---------- Tabs ----------
  const tabLogin = document.getElementById('tabLogin');
  const tabSignup = document.getElementById('tabSignup');
  const panelLogin = document.getElementById('panelLogin');
  const panelSignup = document.getElementById('panelSignup');
  tabLogin.addEventListener('click', () => {
    tabLogin.classList.add('active'); tabSignup.classList.remove('active');
    panelLogin.classList.add('active'); panelSignup.classList.remove('active');
  });
  tabSignup.addEventListener('click', () => {
    tabSignup.classList.add('active'); tabLogin.classList.remove('active');
    panelSignup.classList.add('active'); panelLogin.classList.remove('active');
  });
  if(location.hash === '#signup'){ tabSignup.click(); }

  // ---------- Password show/hide ----------
  document.querySelectorAll('.pw-eye').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.toggle);
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.textContent = showing ? '👁️' : '👀';
      btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    });
  });

  // ---------- Password strength + match checking ----------
  // At least 8 characters, 1 uppercase, 1 lowercase, 1 number, 1 special character.
  const strongPasswordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;
  const signupPassword = document.getElementById('signupPassword');
  const signupPasswordConfirm = document.getElementById('signupPasswordConfirm');
  const pwHint = document.getElementById('pwHint');
  const pwMatchHint = document.getElementById('pwMatchHint');

  function passwordIsStrong(){ return strongPasswordRegex.test(signupPassword.value); }
  function passwordsMatch(){ return signupPassword.value.length > 0 && signupPassword.value === signupPasswordConfirm.value; }

  signupPassword.addEventListener('input', () => {
    if (signupPassword.value.length === 0) { pwHint.className = 'pw-hint'; }
    else { pwHint.className = 'pw-hint ' + (passwordIsStrong() ? 'ok' : 'bad'); }
  });
  signupPasswordConfirm.addEventListener('input', () => {
    if (signupPasswordConfirm.value.length === 0) { pwMatchHint.textContent = ''; pwMatchHint.className = 'pw-hint'; return; }
    pwMatchHint.textContent = passwordsMatch() ? 'Passwords match.' : 'Passwords do not match.';
    pwMatchHint.className = 'pw-hint ' + (passwordsMatch() ? 'ok' : 'bad');
  });

  // ---------- Supabase client ----------
  // Session lives in sessionStorage, not localStorage — closing the
  // browser fully logs the pharmacist out. Matches the blueprint's
  // security rule for a shared counter computer.
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
    auth: { persistSession: true, storage: window.sessionStorage }
  });

  function showMsg(el, text, type){
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  // ---------- Log in ----------
  document.getElementById('formLogin').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const msg = document.getElementById('loginMsg');
    btn.disabled = true; btn.textContent = 'Logging in…';
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      showMsg(msg, error.message, 'error');
      btn.disabled = false; btn.textContent = 'Log in';
    } else {
      showMsg(msg, 'Logged in. Taking you to your dashboard…', 'success');
      // dashboard.html doesn't exist yet — this is the next file we build.
      window.location.href = 'dashboard.html';
    }
  });

  // ---------- Sign up ----------
  document.getElementById('formSignup').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('signupBtn');
    const msg = document.getElementById('signupMsg');
    btn.disabled = true; btn.textContent = 'Creating account…';

    const pharmacyName = document.getElementById('pharmacyName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;

    if (!passwordIsStrong()) {
      showMsg(msg, 'Password needs at least 8 characters, one capital letter, one lowercase letter, one number, and one special character.', 'error');
      btn.disabled = false; btn.textContent = 'Create account';
      return;
    }
    if (!passwordsMatch()) {
      showMsg(msg, 'Passwords do not match.', 'error');
      btn.disabled = false; btn.textContent = 'Create account';
      return;
    }

    const { data: signUpData, error: signUpError } = await supabase.auth.signUp({ email, password });

    if (signUpError) {
      showMsg(msg, signUpError.message, 'error');
      btn.disabled = false; btn.textContent = 'Create account';
      return;
    }

    // Create this pharmacy's own workspace row, owned by the new user.
    const userId = signUpData.user?.id;
    if (userId) {
      const { error: pharmacyError } = await supabase
        .from('pharmacies')
        .insert({ owner_id: userId, name: pharmacyName });

      if (pharmacyError) {
        showMsg(msg, 'Account created, but pharmacy setup failed: ' + pharmacyError.message, 'error');
        btn.disabled = false; btn.textContent = 'Create account';
        return;
      }
    }

    showMsg(msg, 'Account created. Check your email to confirm, then log in.', 'success');
    btn.disabled = false; btn.textContent = 'Create account';
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Batchly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{
    --bg:#FBFAF6; --surface:#F3F1EA; --surface-2:#E8E4D8; --border:#DCD7C8;
    --text:#16211B; --text-dim:#5B685F;
    --brand:#1F5D4C; --brand-dark:#163F34; --brand-tint:#E4EEE9;
    --accent:#C17817; --accent-hover:#D99A3D; --accent-tint:#F6E9D3;
    --positive:#2F9E5B; --caution:#E0932B; --critical:#C94A3B;
    --shadow: 0 1px 2px rgba(22,33,27,0.04), 0 8px 24px rgba(22,33,27,0.06);
    color-scheme: light;
  }
  html[data-theme="dark"]{
    --bg:#0E1512; --surface:#151F1A; --surface-2:#1D2A23; --border:#2A362F;
    --text:#F2F1E9; --text-dim:#9BAAA0;
    --brand:#3FA184; --brand-dark:#2B7A62; --brand-tint:#16241E;
    --accent:#E0A94D; --accent-hover:#EFC077; --accent-tint:#2A2013;
    --positive:#46C27C; --caution:#F0A94E; --critical:#E2695A;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif;
    line-height:1.5; transition:background .25s ease, color .25s ease; padding-bottom:60px;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  h1,h2,h3{font-family:'Fraunces',serif; color:var(--text);}
  button{font-family:inherit;}

  header{
    position:sticky; top:0; z-index:50; background:color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--border);
  }
  .nav{display:flex; align-items:center; justify-content:space-between; padding:14px 20px; max-width:960px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:9px; font-family:'Fraunces',serif; font-weight:700; font-size:1.1rem;}
  .brand-mark{width:26px; height:26px;}
  .pharmacy-name{font-size:0.8rem; color:var(--text-dim); margin-left:6px; padding-left:10px; border-left:1px solid var(--border);}
  .nav-actions{display:flex; align-items:center; gap:8px;}
  .icon-btn{
    width:36px; height:36px; border-radius:9px; border:1px solid var(--border); background:var(--surface);
    cursor:pointer; color:var(--text); display:flex; align-items:center; justify-content:center;
  }
  .icon-btn svg{width:16px; height:16px;}
  .btn-text{
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    padding:8px 14px; border-radius:9px; font-size:0.85rem; font-weight:600; cursor:pointer;
  }

  main{max-width:960px; margin:0 auto; padding:20px;}

  /* ---- Guardian alerts ---- */
  #alerts{display:flex; flex-direction:column; gap:8px; margin-bottom:24px;}
  .alert{
    display:flex; align-items:flex-start; gap:10px; padding:12px 14px; border-radius:12px; font-size:0.88rem;
    border:1px solid;
  }
  .alert.critical{background:color-mix(in srgb, var(--critical) 12%, transparent); border-color:var(--critical); color:var(--critical);}
  .alert.caution{background:color-mix(in srgb, var(--caution) 12%, transparent); border-color:var(--caution); color:var(--caution);}
  .alert b{font-weight:700;}

  /* ---- Quick actions ---- */
  .actions{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:28px;}
  @media(max-width:560px){.actions{grid-template-columns:1fr;}}
  .action-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px;
    cursor:pointer; text-align:left; box-shadow:var(--shadow);
  }
  .action-card h3{font-size:1rem; margin-bottom:4px;}
  .action-card p{font-size:0.82rem; color:var(--text-dim);}

  /* ---- Sections ---- */
  section.panel{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px 20px; margin-bottom:20px; box-shadow:var(--shadow);}
  section.panel h2{font-size:1.05rem; margin-bottom:14px;}
  table{width:100%; border-collapse:collapse; font-size:0.86rem;}
  th{text-align:left; color:var(--text-dim); font-weight:600; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.03em; padding-bottom:8px; border-bottom:1px solid var(--border);}
  td{padding:10px 0; border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  .empty{color:var(--text-dim); font-size:0.88rem; padding:12px 0;}
  .status-pill{font-family:'IBM Plex Mono',monospace; font-size:0.7rem; font-weight:600; border-radius:100px; padding:3px 9px; white-space:nowrap;}
  .status-ok{background:color-mix(in srgb, var(--positive) 16%, transparent); color:var(--positive);}
  .status-caution{background:color-mix(in srgb, var(--caution) 18%, transparent); color:var(--caution);}
  .status-critical{background:color-mix(in srgb, var(--critical) 18%, transparent); color:var(--critical);}

  /* ---- Modal ---- */
  .overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:100;
    align-items:flex-end; justify-content:center;
  }
  @media(min-width:640px){.overlay{align-items:center;}}
  .overlay.open{display:flex;}
  .modal{
    background:var(--bg); width:100%; max-width:440px; border-radius:18px 18px 0 0; padding:24px;
    max-height:88vh; overflow-y:auto; border:1px solid var(--border);
  }
  @media(min-width:640px){.modal{border-radius:18px;}}
  .modal h2{font-size:1.2rem; margin-bottom:16px;}
  label{display:block; font-size:0.82rem; font-weight:600; margin-top:14px; margin-bottom:5px;}
  label:first-of-type{margin-top:0;}
  input,select{
    width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-family:'Inter',sans-serif; font-size:0.92rem;
  }
  input:focus,select:focus{outline:2px solid var(--brand); outline-offset:1px;}
  .modal-actions{display:flex; gap:10px; margin-top:22px;}
  .btn{flex:1; padding:11px 0; border-radius:10px; border:none; font-weight:600; font-size:0.9rem; cursor:pointer;}
  .btn-primary{background:var(--brand); color:#fff;}
  .btn-primary:hover{background:var(--brand-dark);}
  .btn-cancel{background:var(--surface-2); color:var(--text);}
  .btn:disabled{opacity:0.6; cursor:not-allowed;}
  .modal-msg{margin-top:14px; padding:10px 12px; border-radius:9px; font-size:0.85rem; display:none;}
  .modal-msg.error{display:block; background:color-mix(in srgb, var(--critical) 14%, transparent); color:var(--critical);}
  .modal-msg.success{display:block; background:color-mix(in srgb, var(--positive) 14%, transparent); color:var(--positive);}
  .override-row{display:flex; align-items:center; gap:8px; margin-top:14px; font-size:0.85rem;}
  .override-row input{width:auto;}
</style>
</head>
<body>

<header>
  <div class="nav">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none">
        <rect x="4" y="4" width="24" height="24" rx="7" fill="var(--brand)"/>
        <path d="M12 20V12H15.5C17.433 12 19 13.567 19 15.5C19 17.433 17.433 19 15.5 19H13.2" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13.2 19L19 23" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Batchly
      <span class="pharmacy-name" id="pharmacyName">Loading…</span>
    </div>
    <div class="nav-actions">
      <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode">
        <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
      <button class="btn-text" id="logoutBtn">Log out</button>
    </div>
  </div>
</header>

<main>
  <div id="alerts"></div>

  <div class="actions">
    <button class="action-card" id="openSale">
      <h3>Record a sale</h3>
      <p>Pick an item — Batchly finds the right batch automatically.</p>
    </button>
    <button class="action-card" id="openPurchase">
      <h3>Record a purchase</h3>
      <p>New stock, its own batch, its own expiry date.</p>
    </button>
  </div>

  <section class="panel">
    <h2>Current stock</h2>
    <table id="stockTable">
      <thead><tr><th>Item</th><th>Units left</th><th>Nearest expiry</th></tr></thead>
      <tbody id="stockBody"></tbody>
    </table>
    <div class="empty" id="stockEmpty" style="display:none;">No stock yet — record your first purchase to get started.</div>
  </section>

  <section class="panel">
    <h2>Recent sales</h2>
    <table>
      <thead><tr><th>Item</th><th>Qty</th><th>Total</th><th>Date</th></tr></thead>
      <tbody id="salesBody"></tbody>
    </table>
    <div class="empty" id="salesEmpty" style="display:none;">No sales recorded yet.</div>
  </section>
</main>

<!-- SALE MODAL -->
<div class="overlay" id="saleOverlay">
  <div class="modal">
    <h2>Record a sale</h2>
    <form id="saleForm">
      <label for="saleItem">Item</label>
      <select id="saleItem" required></select>
      <label for="saleQty">Quantity</label>
      <input type="number" id="saleQty" min="1" required>
      <label for="salePrice">Price per unit (₦)</label>
      <input type="number" id="salePrice" min="0" step="0.01" required>
      <div id="saleOverrideBlock" style="display:none;">
        <div class="override-row">
          <input type="checkbox" id="saleOverride">
          <label for="saleOverride" style="margin:0;">I understand this batch is expired — sell anyway (logged)</label>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-cancel" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary" id="saleSubmitBtn">Record sale</button>
      </div>
      <div class="modal-msg" id="saleMsg"></div>
    </form>
  </div>
</div>

<!-- PURCHASE MODAL -->
<div class="overlay" id="purchaseOverlay">
  <div class="modal">
    <h2>Record a purchase</h2>
    <form id="purchaseForm">
      <label for="purchaseItem">Item name</label>
      <input type="text" id="purchaseItem" required placeholder="e.g. Paracetamol Type A">
      <label for="purchaseSupplier">Supplier (optional)</label>
      <input type="text" id="purchaseSupplier" placeholder="e.g. Greenlife Pharma">
      <label for="purchaseLot">Lot number (optional)</label>
      <input type="text" id="purchaseLot">
      <label for="purchaseQty">Quantity purchased (e.g. cartons)</label>
      <input type="number" id="purchaseQty" min="1" required>
      <label for="purchaseSellable">Total sellable units (e.g. loose tablets/packs)</label>
      <input type="number" id="purchaseSellable" min="1" required>
      <label for="purchaseCost">Cost price for this purchase (₦)</label>
      <input type="number" id="purchaseCost" min="0" step="0.01" required>
      <label for="purchaseExpiry">Expiry date</label>
      <input type="date" id="purchaseExpiry" required>
      <div class="modal-actions">
        <button type="button" class="btn btn-cancel" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary" id="purchaseSubmitBtn">Record purchase</button>
      </div>
      <div class="modal-msg" id="purchaseMsg"></div>
    </form>
  </div>
</div>

<script>
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
    auth: { persistSession: true, storage: window.sessionStorage }
  });

  let pharmacyId = null;

  // ---------- Theme ----------
  const root = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  const iconSun = document.getElementById('iconSun');
  const iconMoon = document.getElementById('iconMoon');
  function applyTheme(theme){
    root.setAttribute('data-theme', theme);
    iconSun.style.display = theme === 'dark' ? 'none' : 'block';
    iconMoon.style.display = theme === 'dark' ? 'block' : 'none';
  }
  applyTheme(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  themeToggle.addEventListener('click', () => applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

  // ---------- Auth guard ----------
  async function init(){
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = 'auth.html'; return; }

    const { data: pharmacy, error } = await supabase.from('pharmacies').select('*').single();
    if (error || !pharmacy) { window.location.href = 'auth.html'; return; }

    pharmacyId = pharmacy.id;
    document.getElementById('pharmacyName').textContent = pharmacy.name;

    await Promise.all([loadStock(), loadSales()]);
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = 'auth.html';
  });

  // ---------- Load stock + Guardian alerts ----------
  async function loadStock(){
    const { data: batches, error } = await supabase
      .from('stock_batches')
      .select('id, item_id, units_remaining, expiry_date, items(name)')
      .gt('units_remaining', 0)
      .order('expiry_date', { ascending: true });

    const stockBody = document.getElementById('stockBody');
    const stockEmpty = document.getElementById('stockEmpty');
    const alertsEl = document.getElementById('alerts');
    stockBody.innerHTML = '';
    alertsEl.innerHTML = '';

    if (error || !batches || batches.length === 0) {
      stockEmpty.style.display = 'block';
      return;
    }
    stockEmpty.style.display = 'none';

    // Aggregate by item: total units + nearest expiry (batches already sorted by expiry ascending)
    const byItem = {};
    for (const b of batches) {
      const name = b.items?.name || '(unknown item)';
      if (!byItem[name]) byItem[name] = { units: 0, nearestExpiry: b.expiry_date };
      byItem[name].units += b.units_remaining;
    }

    const today = new Date(); today.setHours(0,0,0,0);
    const alerts = [];

    Object.entries(byItem).forEach(([name, info]) => {
      const expiry = new Date(info.nearestExpiry);
      const daysLeft = Math.round((expiry - today) / 86400000);
      let pill = 'status-ok', label = daysLeft + ' days left';
      if (daysLeft < 0) { pill = 'status-critical'; label = 'Expired'; alerts.push({level:'critical', text: `<b>${name}</b> has an expired batch still in stock — selling it is blocked until a manager override.`}); }
      else if (daysLeft <= 90) { pill = 'status-caution'; label = daysLeft + ' days left'; alerts.push({level:'caution', text: `<b>${name}</b> expires in ${daysLeft} days — consider a promotion or moving it to the front shelf.`}); }

      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${name}</td><td>${info.units}</td><td><span class="status-pill ${pill} mono">${label}</span></td>`;
      stockBody.appendChild(tr);
    });

    alerts.forEach(a => {
      const div = document.createElement('div');
      div.className = 'alert ' + a.level;
      div.innerHTML = a.text;
      alertsEl.appendChild(div);
    });
  }

  // ---------- Load recent sales ----------
  async function loadSales(){
    const { data: sales, error } = await supabase
      .from('sales')
      .select('id, quantity, unit_price, sale_date, items(name)')
      .order('sale_date', { ascending: false })
      .limit(10);

    const salesBody = document.getElementById('salesBody');
    const salesEmpty = document.getElementById('salesEmpty');
    salesBody.innerHTML = '';

    if (error || !sales || sales.length === 0) { salesEmpty.style.display = 'block'; return; }
    salesEmpty.style.display = 'none';

    sales.forEach(s => {
      const tr = document.createElement('tr');
      const total = (s.quantity * s.unit_price).toLocaleString();
      const date = new Date(s.sale_date).toLocaleDateString();
      tr.innerHTML = `<td>${s.items?.name || '—'}</td><td>${s.quantity}</td><td>₦${total}</td><td class="mono">${date}</td>`;
      salesBody.appendChild(tr);
    });
  }

  // ---------- Modals ----------
  function openModal(id){ document.getElementById(id).classList.add('open'); }
  function closeModal(id){ document.getElementById(id).classList.remove('open'); }
  document.querySelectorAll('[data-close]').forEach(btn => {
    btn.addEventListener('click', () => btn.closest('.overlay').classList.remove('open'));
  });

  // ---------- Sale modal ----------
  document.getElementById('openSale').addEventListener('click', async () => {
    const select = document.getElementById('saleItem');
    select.innerHTML = '<option>Loading…</option>';
    const { data: items } = await supabase.from('items').select('id, name').order('name');
    select.innerHTML = (items || []).map(i => `<option value="${i.id}">${i.name}</option>`).join('') || '<option disabled>No items yet — record a purchase first</option>';
    document.getElementById('saleOverride').checked = false;
    document.getElementById('saleOverrideBlock').style.display = 'none';
    document.getElementById('saleMsg').className = 'modal-msg';
    openModal('saleOverlay');
  });

  document.getElementById('saleForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('saleSubmitBtn');
    const msg = document.getElementById('saleMsg');
    const overrideBlock = document.getElementById('saleOverrideBlock');
    btn.disabled = true; btn.textContent = 'Recording…';

    const itemId = document.getElementById('saleItem').value;
    const qty = parseInt(document.getElementById('saleQty').value, 10);
    const price = parseFloat(document.getElementById('salePrice').value);
    const overrideChecked = document.getElementById('saleOverride').checked;

    // FEFO: earliest-expiring batch with stock, for this item
    const { data: batch, error: batchError } = await supabase
      .from('stock_batches')
      .select('id, units_remaining, expiry_date')
      .eq('item_id', itemId)
      .gt('units_remaining', 0)
      .order('expiry_date', { ascending: true })
      .limit(1)
      .maybeSingle();

    if (batchError || !batch) {
      msg.textContent = 'No stock available for this item.'; msg.className = 'modal-msg error';
      btn.disabled = false; btn.textContent = 'Record sale'; return;
    }

    const today = new Date(); today.setHours(0,0,0,0);
    const isExpired = new Date(batch.expiry_date) < today;

    if (isExpired && !overrideChecked) {
      overrideBlock.style.display = 'block';
      msg.textContent = 'This batch has expired. Selling is blocked unless you confirm the override above.';
      msg.className = 'modal-msg error';
      btn.disabled = false; btn.textContent = 'Record sale';
      return;
    }

    if (batch.units_remaining < qty) {
      msg.textContent = `Only ${batch.units_remaining} units left in the earliest batch. Splitting a sale across batches isn't supported yet — sell in smaller quantities for now.`;
      msg.className = 'modal-msg error';
      btn.disabled = false; btn.textContent = 'Record sale'; return;
    }

    const { error: saleError } = await supabase.from('sales').insert({
      pharmacy_id: pharmacyId, item_id: itemId, batch_id: batch.id,
      quantity: qty, unit_price: price, was_expired_override: isExpired
    });
    if (saleError) {
      msg.textContent = saleError.message; msg.className = 'modal-msg error';
      btn.disabled = false; btn.textContent = 'Record sale'; return;
    }
